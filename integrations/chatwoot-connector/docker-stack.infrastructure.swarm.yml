version: "3.8"

# Deploy this file as a dedicated, long-lived infrastructure stack.
# Keep the stack running when updating Evolution or the Chatwoot connector.

services:
  evolution_postgres:
    image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    hostname: evolution_postgres
    networks:
      minha_rede:
        aliases:
          - evolution_postgres
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "evolution_go"
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evolution_go"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  evolution_rabbitmq:
    image: rabbitmq:3.13.7-alpine@sha256:d7af1c87c5f1eda13fcfca06db452bf3aeab6619fc3358b68535c0c02c4e52bc
    hostname: evolution_rabbitmq
    networks:
      minha_rede:
        aliases:
          - evolution_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    volumes:
      - evolution_rabbitmq_data:/var/lib/rabbitmq
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          cpus: "0.50"
          memory: 4096M
        reservations:
          memory: 128M

volumes:
  evolution_postgres_data:
    external: true
    name: evolution_postgres_data
  evolution_rabbitmq_data:
    external: true
    name: evolution_rabbitmq_data

networks:
  minha_rede:
    external: true
    name: minha_rede
