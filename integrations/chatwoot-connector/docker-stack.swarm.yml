version: "3.8"

services:
  evolution_go:
    image: "${EVOLUTION_IMAGE}"
    networks:
      - minha_rede
    environment:
      SERVER_PORT: "4000"
      CLIENT_NAME: "Google Chrome"
      OS_NAME: "macOS"
      GLOBAL_API_KEY: "${GLOBAL_API_KEY}"
      POSTGRES_AUTH_DB: "postgresql://postgres:${POSTGRES_PASSWORD}@evolution_postgres:5432/evolution_go?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://postgres:${POSTGRES_PASSWORD}@evolution_postgres:5432/evolution_go?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "true"
      WADEBUG: "INFO"
      LOGTYPE: "console"
      LOG_DIRECTORY: "/app/logs"
      LOG_MAX_SIZE: "100"
      LOG_MAX_BACKUPS: "5"
      LOG_MAX_AGE: "30"
      LOG_COMPRESS: "true"
      CONNECT_ON_STARTUP: "true"
      WEBHOOKFILES: "true"
      AMQP_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@evolution_rabbitmq:5672/"
      AMQP_GLOBAL_ENABLED: "true"
      AMQP_GLOBAL_EVENTS: "MESSAGE,SEND_MESSAGE"
      NATS_URL: ""
      NATS_GLOBAL_ENABLED: "false"
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"
      MINIO_ENABLED: "false"
      PROXY_HOST: "${PROXY_HOST}"
      PROXY_PORT: "${PROXY_PORT}"
      PROXY_USERNAME: "${PROXY_USERNAME}"
      PROXY_PASSWORD: "${PROXY_PASSWORD}"
      PROXY_REQUIRED: "true"
    volumes:
      - evolution_instances_shared:/app/dbdata
      - evolution_go_logs:/app/logs
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.evolution-go.rule=Host(`${EVOLUTION_HOST}`)
        - traefik.http.routers.evolution-go.entrypoints=websecure
        - traefik.http.routers.evolution-go.priority=1
        - traefik.http.routers.evolution-go.tls.certresolver=letsencryptresolver
        - traefik.http.routers.evolution-go.service=evolution-go
        - traefik.http.routers.evolution-go.middlewares=evolution-security
        - traefik.http.middlewares.evolution-security.headers.browserXSSFilter=true
        - traefik.http.middlewares.evolution-security.headers.contentTypeNosniff=true
        - traefik.http.middlewares.evolution-security.headers.forceSTSHeader=true
        - traefik.http.middlewares.evolution-security.headers.stsSeconds=31536000
        - traefik.http.services.evolution-go.loadbalancer.server.port=4000
        - traefik.http.services.evolution-go.loadbalancer.passHostHeader=true

  chatwoot_connector:
    image: ghcr.io/allen-xavier/evolution-go-chatwoot-connector:0.6.1
    networks:
      - minha_rede
    environment:
      PORT: "4100"
      CONNECTOR_API_KEY: "${GLOBAL_API_KEY}"
      CONNECTOR_DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@evolution_postgres:5432/evolution_go?sslmode=disable"
      EVOLUTION_API_URL: "http://evolution_go:4000"
      EVOLUTION_API_KEY: "${GLOBAL_API_KEY}"
      AMQP_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@evolution_rabbitmq:5672/"
      CONNECTOR_PROXY_REQUIRED: "true"
      PROXY_MONITOR_INTERVAL_SECONDS: "60"
      PROXY_COLLISION_ACTION: "alert"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.50"
          memory: 2048M
        reservations:
          cpus: "0.10"
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.http.routers.chatwoot-connector.rule=Host(`${EVOLUTION_HOST}`) && PathPrefix(`/chatwoot`)
        - traefik.http.routers.chatwoot-connector.entrypoints=websecure
        - traefik.http.routers.chatwoot-connector.priority=100
        - traefik.http.routers.chatwoot-connector.tls.certresolver=letsencryptresolver
        - traefik.http.routers.chatwoot-connector.service=chatwoot-connector
        - traefik.http.routers.chatwoot-connector.middlewares=evolution-security
        - traefik.http.services.chatwoot-connector.loadbalancer.server.port=4100

  evolution_postgres:
    image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    hostname: evolution_postgres
    networks:
      - minha_rede
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "evolution_go"
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evolution_go"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  evolution_rabbitmq:
    image: rabbitmq:3.13.7-alpine@sha256:d7af1c87c5f1eda13fcfca06db452bf3aeab6619fc3358b68535c0c02c4e52bc
    hostname: evolution_rabbitmq
    networks:
      - minha_rede
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    volumes:
      - evolution_rabbitmq_data:/var/lib/rabbitmq
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.50"
          memory: 4096M
        reservations:
          memory: 128M

volumes:
  evolution_instances_shared:
    external: true
    name: evolution_instances_shared
  evolution_go_logs:
    external: true
    name: evolution_go_logs
  evolution_postgres_data:
    external: true
    name: evolution_postgres_data
  evolution_rabbitmq_data:
    external: true
    name: evolution_rabbitmq_data

networks:
  minha_rede:
    external: true
    name: minha_rede
